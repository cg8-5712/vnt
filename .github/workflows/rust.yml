name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: windows-x86_64
          - os: macos-13
            target: x86_64-apple-darwin
            asset_name: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: vnt-web/frontend/yarn.lock

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler musl-tools zip

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install protobuf

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install protoc -y

      - name: Build frontend assets
        shell: bash
        working-directory: vnt-web/frontend
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Build release binaries
        shell: bash
        run: |
          cargo build --locked --release --target "${{ matrix.target }}" --bin vnt2_web --features vnt-web
          cargo build --locked --release --target "${{ matrix.target }}" --bin vnt2_cli --features vnt-ipc
          cargo build --locked --release --target "${{ matrix.target }}" --bin vnt2_ctrl --features vnt-ipc

      - name: Package release (Windows)
        if: runner.os == 'Windows'
        id: package_windows
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $archive = "vnt2-${{ matrix.asset_name }}-$tag.zip"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\vnt2_web.exe" package\
          Copy-Item "target\${{ matrix.target }}\release\vnt2_cli.exe" package\
          Copy-Item "target\${{ matrix.target }}\release\vnt2_ctrl.exe" package\
          Copy-Item "README.md" package\
          Copy-Item "data\config.example.toml" package\
          Compress-Archive -Path package\* -DestinationPath "artifacts\$archive" -Force
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Package release (Unix)
        if: runner.os != 'Windows'
        id: package_unix
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          ARCHIVE="vnt2-${{ matrix.asset_name }}-${TAG}.zip"
          mkdir -p artifacts package
          cp "target/${{ matrix.target }}/release/vnt2_web" package/
          cp "target/${{ matrix.target }}/release/vnt2_cli" package/
          cp "target/${{ matrix.target }}/release/vnt2_ctrl" package/
          cp README.md package/
          cp data/config.example.toml package/
          (
            cd package
            zip -r "../artifacts/$ARCHIVE" ./*
          )
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: artifacts/*.zip

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
