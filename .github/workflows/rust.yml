name: Rust

on:
  push:
    tags:
      - '*'

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # necessary for windows
    shell: bash
permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.TARGET }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - TARGET: x86_64-unknown-linux-musl
            OS: ubuntu-latest
          - TARGET: aarch64-unknown-linux-musl
            OS: ubuntu-latest
          - TARGET: armv7-unknown-linux-musleabihf
            OS: ubuntu-latest
          - TARGET: armv7-unknown-linux-musleabi
            OS: ubuntu-latest
          - TARGET: arm-unknown-linux-musleabihf
            OS: ubuntu-latest
          - TARGET: arm-unknown-linux-musleabi
            OS: ubuntu-latest
          - TARGET: x86_64-apple-darwin
            OS: macos-15-intel
          - TARGET: aarch64-apple-darwin
            OS: macos-14
          - TARGET: i686-pc-windows-msvc
            OS: windows-latest
          - TARGET: x86_64-pc-windows-msvc
            OS: windows-latest
          - TARGET: aarch64-pc-windows-msvc
            OS: windows-latest
          - TARGET: mipsel-unknown-linux-musl
            OS: ubuntu-latest
          - TARGET: mips-unknown-linux-musl
            OS: ubuntu-latest
          - TARGET: x86_64-unknown-freebsd
            OS: ubuntu-latest
            ARTIFACT_NAME: freebsd-13.2-x86_64
            BSD_VERSION: 13.2
    runs-on: ${{ matrix.OS }}
    env:
      NAME: Vnt
      TARGET: ${{ matrix.TARGET }}
      OS: ${{ matrix.OS }}
      FEATURES: ${{ matrix.FEATURES }}
    steps:
      - uses: actions/checkout@v4
      - name: Init submodules
        run: git submodule update --init --recursive --remote && git submodule status
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ./target
          key: build-cargo-registry-${{matrix.TARGET}}
      - name: Install Protobuf (MacOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install Protobuf (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc
      - name: Use strawberry perl
        if: runner.os == 'Windows'
        run: echo OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl >> $GITHUB_ENV
      - name: List
        run: find ./
      - name: Build Vnt X86_64-FreeBSD
        uses: cross-platform-actions/action@v0.23.0
        if: ${{ endsWith(matrix.TARGET, 'freebsd') }}
        env:
          TARGET: ${{ matrix.TARGET }}
        with:
          operating_system: freebsd
          environment_variables: TARGET
          architecture: x86-64
          version: ${{ matrix.BSD_VERSION }}
          shell: bash
          memory: 5G
          cpu_count: 4
          run: |
            uname -a
            echo $SHELL
            pwd
            ls -lah
            whoami
            env | sort
            sudo pkg install -y git protobuf llvm15
            curl --proto 'https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source $HOME/.cargo/env
            export CC=clang
            export CXX=clang++
            export CARGO_TERM_COLOR=always
            cargo build --release --verbose --bin vnt2_web --features vnt-web --target $TARGET
            cargo build --release --verbose --bin vnt2_cli --features vnt-ipc --target $TARGET
      - name: Install and configure dependencies
        if: ${{ ! endsWith(matrix.TARGET, 'freebsd') }}
        run: |
          # dependencies are only needed on ubuntu as that's the only place where
          # we make cross-compilation
          
          if [[ $OS =~ ^ubuntu.*$ ]]; then
            sudo apt-get update && sudo apt-get install protobuf-compiler clang llvm libc6-dev-i386 crossbuild-essential-arm64 crossbuild-essential-armhf musl-tools libboost-all-dev libc6-dev -y
            #  curl -s musl.cc | grep mipsel
            case $TARGET in 
              mipsel-unknown-linux-musl)
                MUSL_URI=mipsel-linux-muslsf-cross
                URL=mipsel-linux-muslsf
                ;;
              aarch64-unknown-linux-musl)
                MUSL_URI=aarch64-linux-musl-cross
                ;;
              armv7-unknown-linux-musleabihf)
                MUSL_URI=armv7l-linux-musleabihf-cross
                ;;    
              armv7-unknown-linux-musleabi)
                MUSL_URI=armv7m-linux-musleabi-cross
                ;; 
              arm-unknown-linux-musleabihf)
                MUSL_URI=arm-linux-musleabihf-cross
                ;;    
              arm-unknown-linux-musleabi)
                MUSL_URI=arm-linux-musleabi-cross
                ;;        
              mips-unknown-linux-musl)
                MUSL_URI=mips-linux-muslsf-cross
                URL=mips-linux-muslsf
                ;;
            esac
          
          
            if [  -n "$MUSL_URI" ]; then
              mkdir -p ./musl_gcc 
              wget -c https://github.com/rustp2p/musl-cross/releases/download/0.0.1/$MUSL_URI.tgz -P /opt/musl_gcc/
              tar zxf /opt/musl_gcc/$MUSL_URI.tgz -C /opt/musl_gcc/
              sudo ln -s /opt/musl_gcc/$MUSL_URI/bin/*gcc /usr/bin/
            fi
          fi
          if [[ $TARGET =~ ^mips.*$ ]]; then
            cd /opt/musl_gcc/${URL}-cross/lib/gcc/${URL}/11.2.1
            cp libgcc_eh.a libunwind.a
            rustup toolchain install nightly-x86_64-unknown-linux-gnu
            rustup component add rust-src --toolchain nightly-x86_64-unknown-linux-gnu
            RUST_LIB_SRC=$HOME/.rustup/toolchains/nightly-x86_64-unknown-linux-gnu/lib/rustlib/src/rust/
            if [[ -f $RUST_LIB_SRC/library/Cargo.lock && ! -f $RUST_LIB_SRC/Cargo.lock ]]; then 
               cp -f $RUST_LIB_SRC/library/Cargo.lock $RUST_LIB_SRC/Cargo.lock
            fi
          fi
          rustup -V
          
          # some additional configuration for cross-compilation on linux
          cat >>~/.cargo/config.toml <<EOF
          [target.x86_64-unknown-linux-musl]
          rustflags = ["-C", "target-feature=+crt-static","-C", "strip=symbols"]
          [target.aarch64-unknown-linux-musl]
          linker = "aarch64-linux-musl-gcc"
          rustflags = ["-C", "target-feature=+crt-static","-C", "strip=symbols"]
          [target.armv7-unknown-linux-musleabihf]
          linker = "armv7l-linux-musleabihf-gcc"
          rustflags = ["-C", "target-feature=+crt-static","-C", "strip=symbols"]
          [target.armv7-unknown-linux-musleabi]
          linker = "armv7m-linux-musleabi-gcc"
          rustflags = ["-C", "target-feature=+crt-static","-C", "strip=symbols"]
          [target.arm-unknown-linux-musleabihf]
          linker = "arm-linux-musleabihf-gcc"
          rustflags = ["-C", "target-feature=+crt-static","-C", "strip=symbols"]   
          [target.arm-unknown-linux-musleabi]
          linker = "arm-linux-musleabi-gcc"
          rustflags = ["-C", "target-feature=+crt-static","-C", "strip=symbols"]
          [target.mipsel-unknown-linux-musl]
          linker = "mipsel-linux-muslsf-gcc"
          rustflags = ["-C", "target-feature=+crt-static","-C", "strip=symbols","-C", "link-arg=-static",
          "-C", "relocation-model=static","-C", "link-arg=-no-pie","--cfg", "compiler_builtins_no_debug",
          "-L", "/opt/musl_gcc/mipsel-linux-muslsf-cross/mipsel-linux-muslsf/lib",
          "-L", "/opt/musl_gcc/mipsel-linux-muslsf-cross/lib/gcc/mipsel-linux-muslsf/11.2.1"]
          [target.mips-unknown-linux-musl]
          linker = "mips-linux-muslsf-gcc"
          rustflags = ["-C", "target-feature=+crt-static","-C", "strip=symbols","-C", "link-arg=-static",
          "-C", "relocation-model=static","-C", "link-arg=-no-pie","--cfg", "compiler_builtins_no_debug",
          "-L", "/opt/musl_gcc/mips-linux-muslsf-cross/mips-linux-muslsf/lib",
          "-L", "/opt/musl_gcc/mips-linux-muslsf-cross/lib/gcc/mips-linux-muslsf/11.2.1"]
          [target.x86_64-pc-windows-msvc]
          rustflags = ["-C", "target-feature=+crt-static","-C", "strip=symbols"]    
          [target.i686-pc-windows-msvc]
          rustflags = ["-C", "target-feature=+crt-static","-C", "strip=symbols"]      
          [target.x86_64-apple-darwin]
          rustflags = ["-C", "target-feature=+crt-static","-C", "strip=symbols"] 
          [target.aarch64-apple-darwin]
          rustflags = ["-C", "target-feature=+crt-static","-C", "strip=symbols"]     
          [target.i686-unknown-linux-musl]
          rustflags = ["-C", "target-feature=+crt-static","-C", "strip=symbols"]    
          [target.i686-unknown-linux-gnu]
          rustflags = ["-C", "target-feature=+crt-static","-C", "strip=symbols"]   
          EOF
      - name: Install rust target
        if: ${{ ! endsWith(matrix.TARGET, 'freebsd') &&  ! startsWith(matrix.TARGET, 'mips') }}
        run: rustup target add $TARGET
      - name: Run build Vnt
        if: ${{ ! endsWith(matrix.TARGET, 'freebsd') }}
        run: |
          if [[ $TARGET =~ ^mips.*$ ]]; then
            cargo +nightly build --release --verbose --target $TARGET -Z build-std=std,panic_abort --bin vnt2_web --features vnt-web
            cargo +nightly build --release --verbose --target $TARGET -Z build-std=std,panic_abort --bin vnt2_cli --features vnt-ipc
          else
            cargo build --release --verbose --target $TARGET --bin vnt2_web --features vnt-web
            cargo build --release --verbose --target $TARGET --bin vnt2_cli --features vnt-ipc
          fi
          ldd ./target/$TARGET/release/vnt2_web || true
          file ./target/$TARGET/release/vnt2_web || true
      - name: List target
        run: find ./target
      - name: Package
        run: |
          mkdir -p ./artifacts
          mkdir -p ./package/web
          mkdir -p ./package/cli
          if [[ $GITHUB_REF_TYPE =~ ^tag$ ]]; then
            TAG=$GITHUB_REF_NAME
          else
            TAG=$GITHUB_SHA
          fi
          WEB_ZIP_NAME="vnt-web-${TARGET}-${TAG}.zip"
          CLI_ZIP_NAME="vnt-cli-${TARGET}-${TAG}.zip"

          if [[ $OS =~ ^windows.*$ ]]; then
              cp ./target/$TARGET/release/vnt2_web.exe ./package/web/vnt-web.exe
              cp ./target/$TARGET/release/vnt2_cli.exe ./package/cli/vnt-cli.exe
              cd ./package/web
              7z a -tzip "../../artifacts/$WEB_ZIP_NAME" ./*
              cd ../cli
              7z a -tzip "../../artifacts/$CLI_ZIP_NAME" ./*
          else
              cp ./target/$TARGET/release/vnt2_web ./package/web/vnt-web
              cp ./target/$TARGET/release/vnt2_cli ./package/cli/vnt-cli
              cd ./package/web
              zip "../../artifacts/$WEB_ZIP_NAME" ./*
              cd ../cli
              zip "../../artifacts/$CLI_ZIP_NAME" ./*
          fi
      - name: List target Vnt
        run: find ./artifacts
      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vnt-${{ matrix.TARGET }}
          path: |
            ./artifacts/*
  app:
    name: App ${{ matrix.NAME }}
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.OS }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - NAME: linux-x64
            OS: ubuntu-22.04
            PLATFORM: linux
            ARCH: x64
          - NAME: linux-arm64
            OS: ubuntu-22.04-arm
            PLATFORM: linux
            ARCH: arm64
          - NAME: windows-x64
            OS: windows-2022
            PLATFORM: windows
            ARCH: x64
          - NAME: windows-arm64
            OS: windows-11-arm
            PLATFORM: windows
            ARCH: arm64
          - NAME: macos-x64
            OS: macos-15-intel
            PLATFORM: macos
            ARCH: x64
          - NAME: macos-arm64
            OS: macos-14
            PLATFORM: macos
            ARCH: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: |
            vnt-app/yarn.lock
            vnt-web/frontend/yarn.lock
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - name: Install Protobuf (MacOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install Protobuf (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc
      - name: Use strawberry perl
        if: runner.os == 'Windows'
        run: echo OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl >> $GITHUB_ENV
      - name: Enable Corepack
        run: corepack enable
      - name: Install frontend dependencies
        run: yarn --cwd vnt-web/frontend install --frozen-lockfile
      - name: Install app dependencies
        run: yarn --cwd vnt-app install --frozen-lockfile
      - name: Build desktop app
        run: yarn --cwd vnt-app build
      - name: Collect app artifacts
        run: |
          mkdir -p ./release-files
          TAG="${GITHUB_REF_NAME}"
          PLATFORM="${{ matrix.PLATFORM }}"
          ARCH="${{ matrix.ARCH }}"
          RELEASE_ROOT="./target/release"
          BUNDLE_ROOT="${RELEASE_ROOT}/bundle"

          copy_release_file() {
            local source_file="$1"
            local target_name="$2"

            if [[ -f "$source_file" ]]; then
              cp "$source_file" "./release-files/${target_name}"
            fi
          }

          if [[ "${PLATFORM}" == "windows" ]]; then
            PORTABLE_EXE="$(find "${RELEASE_ROOT}" -maxdepth 1 -type f -name '*.exe' ! -name '*-setup.exe' -print -quit)"
            MSI_FILE="$(find "${BUNDLE_ROOT}" -type f -name '*.msi' -print -quit)"
            SETUP_EXE="$(find "${BUNDLE_ROOT}" -type f -name '*-setup.exe' -print -quit)"

            copy_release_file "${PORTABLE_EXE}" "vnt-app-${PLATFORM}-${ARCH}-${TAG}-portable.exe"
            copy_release_file "${MSI_FILE}" "vnt-app-${PLATFORM}-${ARCH}-${TAG}-installer.msi"
            copy_release_file "${SETUP_EXE}" "vnt-app-${PLATFORM}-${ARCH}-${TAG}-setup.exe"
          else
            APPIMAGE_FILE="$(find "${BUNDLE_ROOT}" -type f -name '*.AppImage' -print -quit)"
            DEB_FILE="$(find "${BUNDLE_ROOT}" -type f -name '*.deb' -print -quit)"
            RPM_FILE="$(find "${BUNDLE_ROOT}" -type f -name '*.rpm' -print -quit)"
            DMG_FILE="$(find "${BUNDLE_ROOT}" -type f -name '*.dmg' -print -quit)"
            APP_TAR_FILE="$(find "${BUNDLE_ROOT}" -type f -name '*.app.tar.gz' -print -quit)"

            copy_release_file "${APPIMAGE_FILE}" "vnt-app-${PLATFORM}-${ARCH}-${TAG}.AppImage"
            copy_release_file "${DEB_FILE}" "vnt-app-${PLATFORM}-${ARCH}-${TAG}.deb"
            copy_release_file "${RPM_FILE}" "vnt-app-${PLATFORM}-${ARCH}-${TAG}.rpm"
            copy_release_file "${DMG_FILE}" "vnt-app-${PLATFORM}-${ARCH}-${TAG}.dmg"
            copy_release_file "${APP_TAR_FILE}" "vnt-app-${PLATFORM}-${ARCH}-${TAG}.app.tar.gz"
          fi

          if [[ -z "$(find ./release-files -type f -print -quit)" ]]; then
            echo "No app bundle files found" >&2
            exit 1
          fi

          find ./release-files -type f -print
      - name: Archive app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vnt-app-${{ matrix.NAME }}
          path: |
            ./release-files/*
  docker:
    name: Docker ${{ matrix.IMAGE_NAME }}
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - IMAGE_NAME: vnt_cli
            DOCKERFILE: Dockerfile.cli
          - IMAGE_NAME: vnt_web
            DOCKERFILE: Dockerfile
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Prepare image tags
        id: prep
        env:
          IMAGE_NAME: ${{ matrix.IMAGE_NAME }}
        run: |
          if [[ -z "$DOCKERHUB_NAMESPACE" ]]; then
            echo "vars.DOCKERHUB_NAMESPACE or secrets.DOCKERHUB_USERNAME must be set" >&2
            exit 1
          fi

          GHCR_NAMESPACE="${GITHUB_REPOSITORY_OWNER,,}"
          DOCKERHUB_NAMESPACE="${DOCKERHUB_NAMESPACE,,}"

          {
            echo "tags<<EOF"
            echo "ghcr.io/${GHCR_NAMESPACE}/${IMAGE_NAME}:${GITHUB_REF_NAME}"
            echo "docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE_NAME}:${GITHUB_REF_NAME}"
            if [[ "$GITHUB_REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ghcr.io/${GHCR_NAMESPACE}/${IMAGE_NAME}:latest"
              echo "docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push ${{ matrix.IMAGE_NAME }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ matrix.IMAGE_NAME }}
  # deploys to github releases on tag
  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - app
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: List
        run: find ./artifacts
      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN  }}
          file: ./artifacts/**/*.*
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
