
refresh_rate: 30 seconds
appenders:
  rolling_file:
    kind: rolling_file
    path: logs\vnt_app.log
    append: true
    encoder:
      pattern: "{d} [{f}:{L}] {h({l})} {M}:{m}{n}"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 10 mb
      roller:
        kind: fixed_window
        pattern: logs\vnt_app.{}.log
        base: 1
        count: 5
  console:
    kind: console
    encoder:
      pattern: "{d} {h({l})} {m}{n}"
root:
  level: info
  appenders:
    - rolling_file
    - console
